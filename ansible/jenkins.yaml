- name: setup jenkins server
  become: true
  hosts: jenkins
  tasks:
    - name: install java and git
      ansible.builtin.apt:
        name:
          - openjdk-21-jre-headless
          - git
        state: present
        update_cache: true

    - name: add jenkins apt key
      ansible.builtin.get_url:
        url: https://pkg.jenkins.io/debian-stable/jenkins.io-2026.key
        dest: /etc/apt/keyrings/jenkins-keyring.asc
        mode: '0644'
        force: true

    - name: add jenkins apt repository
      ansible.builtin.apt_repository:
        repo: "deb [signed-by=/etc/apt/keyrings/jenkins-keyring.asc] https://pkg.jenkins.io/debian-stable binary/"
        filename: jenkins
        state: present

    - name: install jenkins
      ansible.builtin.apt:
        name: jenkins
        state: present
        update_cache: true

    - name: ensure jenkins is running
      ansible.builtin.systemd:
        name: jenkins
        state: started
        enabled: yes
